<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070B14" />
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.4" />
  
  <!-- Shield Emblem -->
  <path d="M 256 100 L 370 150 C 370 270, 256 380, 256 410 C 256 380, 142 270, 142 150 Z" 
        fill="#0F172A" stroke="url(#goldGrad)" stroke-width="12" stroke-linejoin="round" />
  
  <!-- Letter S Monogram -->
  <path d="M 290 190 C 290 160, 222 160, 222 190 C 222 230, 290 230, 290 280 C 290 320, 218 320, 218 290" 
        fill="none" stroke="url(#goldGrad)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" />
