name: Savrdh Credit Platform CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - feature/savrdh-credit-platform
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://qngjmepksxavimwnhtqt.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Type check
        run: npm run lint
      - name: Production build
        run: npm run build
